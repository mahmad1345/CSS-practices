<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container{
            
            width: 253px;
            height: 220px;
            background-color: aquamarine;
        }
        /*Building Animation content using CSS*/
        .box{
            animation-name: AhmadkaAnimation;
            animation-duration: 5s;
            animation-delay: 1s;
            animation-iteration-count: 2;
            
            width: 80px;
            height: 60px;
            border: 2px solid black;
            margin: 20px 20px;
            background-color: blueviolet
            
        }
        @keyframes AhmadkaAnimation{
            from{

            }
            to{
                transform: translateX(100px);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="box">
                I am Animated content.
            </div>
        </div>
    </header>
</body>
</html>
