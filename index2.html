<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Designed</title>
    <style>
        :root{
            --primary: rgb(161, 40, 127);
            --text-color: rgb(56, 37, 37);
            --secondary: rgb(62, 58, 58);
        }
        ul li{
            list-style: none;
            display: inline;
            padding: 3px;
            
        }
        ul li{
           color: var(--primary);
          
            
          }
        header{
            margin: 3px;
            padding: 0;
            border: 2px solid black;
             background-color: aquamarine;
        }
        

    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact Us</li>
            </ul>
        </nav>
    </header>
    
</body>
</html>
